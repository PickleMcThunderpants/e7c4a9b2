name: Sync
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sync
        env:
          BUNDLE: ${{ secrets.BUNDLE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { createReadStream, createWriteStream } from 'node:fs';
          import { mkdtemp, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { gunzipSync } from 'node:zlib';
          import { Readable, Transform } from 'node:stream';
          import { pipeline } from 'node:stream/promises';
          try {
            const bundle = JSON.parse(gunzipSync(Buffer.from(process.env.BUNDLE, 'base64')));
            const repo = process.env.GITHUB_REPOSITORY;
            const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' };
            async function api(endpoint, options = {}) {
              const response = await fetch(`https://api.github.com/repos/${repo}/${endpoint}`, { ...options, headers });
              if (!response.ok) throw new Error(`API request failed (${response.status})`);
              return response.status === 204 ? null : response.json();
            }
            const release = await api(`releases/${bundle.releaseId}`);
            if (!release.draft || release.tag_name !== bundle.tag) throw new Error('Unexpected release');
            const assets = [];
            for (let page = 1; ; page++) {
              const batch = await api(`releases/${release.id}/assets?per_page=100&page=${page}`);
              assets.push(...batch);
              if (batch.length < 100) break;
            }
            const existing = new Map(assets.map(asset => [asset.name, asset]));
            const uploadUrl = release.upload_url.split('{')[0];
            if (new URL(uploadUrl).hostname !== 'uploads.github.com') throw new Error('Unexpected upload host');
            const temporary = await mkdtemp(path.join(tmpdir(), 'sync-'));
            let cursor = 0, completed = 0;
            const results = await Promise.allSettled(Array.from({ length: 6 }, async () => {
              while (cursor < bundle.files.length) {
                const item = bundle.files[cursor++];
                if (!/^[a-f0-9]{64}$/.test(item.sha256) || item.name !== `${item.sha256}.geojson.gz`) throw new Error('Invalid file');
                const old = existing.get(item.name);
                if (old?.state === 'uploaded') {
                  if (old.size !== item.size || old.digest !== `sha256:${item.sha256}`) throw new Error('Invalid existing asset');
                  completed++; continue;
                }
                if (old) {
                  if (old.state !== 'starter' || old.digest || ![0, item.size].includes(old.size)) throw new Error('Unexpected asset state');
                  await api(`releases/assets/${old.id}`, { method: 'DELETE' });
                }
                const file = path.join(temporary, item.name);
                const response = await fetch(item.source, { signal: AbortSignal.timeout(300000) });
                if (!response.ok || !response.body) throw new Error(`Download failed (${response.status})`);
                const hash = createHash('sha256');
                let size = 0;
                await pipeline(Readable.fromWeb(response.body), new Transform({ transform(chunk, encoding, done) {
                  size += chunk.length;
                  if (size > item.size) return done(new Error('Size mismatch'));
                  hash.update(chunk); done(null, chunk);
                } }), createWriteStream(file));
                if (size !== item.size || hash.digest('hex') !== item.sha256) throw new Error('Integrity check failed');
                const uploaded = await fetch(`${uploadUrl}?name=${item.name}`, { method: 'POST', redirect: 'error',
                  headers: { ...headers, 'Content-Type': 'application/octet-stream' }, body: createReadStream(file), duplex: 'half', signal: AbortSignal.timeout(300000) });
                if (!uploaded.ok) throw new Error('Upload failed');
                const asset = await uploaded.json();
                if (asset.size !== item.size || asset.digest !== `sha256:${item.sha256}`) throw new Error('Upload integrity check failed');
                await rm(file);
                completed++;
                if (completed % 20 === 0) console.log(`Verified ${completed}/${bundle.files.length} files`);
              }
            }));
            await rm(temporary, { recursive: true, force: true });
            const failed = results.find(result => result.status === 'rejected');
            if (failed) throw failed.reason;
            console.log(`Verified ${completed} files`);
          } catch (error) {
            console.error(`Transfer failed: ${String(error.message).replace(/https?:\/\/\S+/g, '[url]')}`);
            process.exitCode = 1;
          }
          NODE
